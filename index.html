<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JunXChlore — Dreamer</title>
<meta name="description" content="JunXChlore's personal homepage — Dreamer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --neon-cyan:#00f0ff;
  --neon-pink:#ff2d95;
  --neon-purple:#b026ff;
  --neon-yellow:#f5f740;
  --bg-dark:#0a0a0f;
  --bg-card:rgba(10,10,20,0.7);
  --text-main:#e0e0e8;
  --text-dim:#6a6a7a;
  --grid-color:rgba(0,240,255,0.04);
}
html{scroll-behavior:smooth}
body{
  background:var(--bg-dark);
  color:var(--text-main);
  font-family:'Rajdhani',sans-serif;
  overflow-x:hidden;
  min-height:100vh;
}

/* === GRID BACKGROUND === */
body::before{
  content:'';position:fixed;inset:0;z-index:0;
  background-image:
    linear-gradient(var(--grid-color) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid-color) 1px,transparent 1px);
  background-size:60px 60px;
  animation:gridScroll 20s linear infinite;
}
@keyframes gridScroll{to{background-position:60px 60px}}

/* === AMBIENT GLOW === */
.ambient{
  position:fixed;inset:0;z-index:0;pointer-events:none;
}
.ambient .orb{
  position:absolute;border-radius:50%;filter:blur(120px);opacity:.25;
  animation:orbFloat 8s ease-in-out infinite alternate;
}
.ambient .orb:nth-child(1){width:500px;height:500px;background:var(--neon-cyan);top:-10%;left:-5%;animation-duration:10s}
.ambient .orb:nth-child(2){width:400px;height:400px;background:var(--neon-pink);bottom:-10%;right:-5%;animation-delay:2s;animation-duration:12s}
.ambient .orb:nth-child(3){width:300px;height:300px;background:var(--neon-purple);top:40%;left:50%;animation-delay:4s;animation-duration:9s}
@keyframes orbFloat{
  0%{transform:translate(0,0) scale(1)}
  100%{transform:translate(40px,-30px) scale(1.15)}
}

/* === SCANLINE === */
.scanline{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:repeating-linear-gradient(
    0deg,
    transparent,transparent 2px,
    rgba(0,240,255,0.015) 2px,rgba(0,240,255,0.015) 4px
  );
}

/* === MAIN CONTAINER === */
.container{
  position:relative;z-index:2;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;padding:2rem;
}

/* === AVATAR === */
.avatar-wrapper{
  position:relative;margin-bottom:2rem;
  animation:fadeInUp .8s ease-out both;
}
.avatar-ring{
  width:160px;height:160px;border-radius:50%;padding:4px;
  background:conic-gradient(var(--neon-cyan),var(--neon-purple),var(--neon-pink),var(--neon-cyan));
  animation:ringRotate 4s linear infinite;
}
@keyframes ringRotate{to{filter:hue-rotate(360deg)}}
.avatar-inner{
  width:100%;height:100%;border-radius:50%;
  background:var(--bg-dark);
  display:flex;align-items:center;justify-content:center;
  font-family:'Orbitron',monospace;font-size:2.8rem;font-weight:900;
  color:var(--neon-cyan);
  text-shadow:0 0 20px var(--neon-cyan),0 0 40px rgba(0,240,255,0.3);
}
.avatar-glow{
  position:absolute;inset:-8px;border-radius:50%;
  background:conic-gradient(var(--neon-cyan),var(--neon-purple),var(--neon-pink),var(--neon-cyan));
  filter:blur(20px);opacity:.35;z-index:-1;
  animation:ringRotate 4s linear infinite;
}

/* === NAME / GLITCH === */
.name-section{
  text-align:center;margin-bottom:2.5rem;
  animation:fadeInUp .8s ease-out .2s both;
}
.name{
  font-family:'Orbitron',monospace;
  font-size:clamp(2.2rem,6vw,4rem);
  font-weight:900;
  color:#fff;
  text-transform:uppercase;
  letter-spacing:.15em;
  position:relative;
  display:inline-block;
}
.name::before,.name::after{
  content:attr(data-text);
  position:absolute;top:0;left:0;right:0;
  overflow:hidden;
}
.name::before{
  color:var(--neon-cyan);
  text-shadow:0 0 10px var(--neon-cyan);
  animation:glitch1 3s infinite linear alternate;
  clip-path:inset(0 0 65% 0);
}
.name::after{
  color:var(--neon-pink);
  text-shadow:0 0 10px var(--neon-pink);
  animation:glitch2 2.5s infinite linear alternate;
  clip-path:inset(65% 0 0 0);
}
@keyframes glitch1{
  0%,90%{transform:translate(0)}
  92%{transform:translate(-3px,1px)}
  94%{transform:translate(3px,-1px)}
  96%{transform:translate(-2px)}
  98%{transform:translate(2px,1px)}
  100%{transform:translate(0)}
}
@keyframes glitch2{
  0%,88%{transform:translate(0)}
  90%{transform:translate(3px,-1px)}
  93%{transform:translate(-3px,1px)}
  95%{transform:translate(2px)}
  97%{transform:translate(-2px,-1px)}
  100%{transform:translate(0)}
}

/* === TAGLINE === */
.tagline{
  font-family:'Share Tech Mono',monospace;
  font-size:clamp(1rem,2.5vw,1.3rem);
  color:var(--neon-cyan);
  letter-spacing:.5em;
  text-transform:uppercase;
  margin-top:.8rem;
  text-shadow:0 0 15px var(--neon-cyan),0 0 30px rgba(0,240,255,0.2);
  position:relative;
}
.tagline .cursor{
  display:inline-block;width:2px;height:1.1em;
  background:var(--neon-cyan);vertical-align:text-bottom;
  animation:blink 1s step-end infinite;
  box-shadow:0 0 8px var(--neon-cyan);
}
@keyframes blink{50%{opacity:0}}

/* === DIVIDER === */
.divider{
  width:clamp(200px,50vw,400px);height:1px;
  background:linear-gradient(90deg,transparent,var(--neon-cyan),var(--neon-pink),transparent);
  margin:0 auto 2.5rem;
  animation:fadeInUp .8s ease-out .4s both;
  box-shadow:0 0 12px rgba(0,240,255,0.3);
}

/* === SOCIAL LINKS === */
.social-grid{
  display:flex;flex-wrap:wrap;justify-content:center;gap:1rem;
  margin-bottom:3rem;
  animation:fadeInUp .8s ease-out .6s both;
}
.social-link{
  display:flex;align-items:center;gap:.6rem;
  padding:.7rem 1.4rem;
  border:1px solid rgba(0,240,255,0.2);
  border-radius:4px;
  background:var(--bg-card);
  backdrop-filter:blur(10px);
  text-decoration:none;
  color:var(--text-main);
  font-family:'Share Tech Mono',monospace;
  font-size:.85rem;
  letter-spacing:.08em;
  transition:all .3s ease;
  position:relative;
  overflow:hidden;
}
.social-link::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(0,240,255,0.08),transparent);
  opacity:0;transition:opacity .3s;
}
.social-link:hover::before{opacity:1}
.social-link:hover{
  border-color:var(--neon-cyan);
  box-shadow:0 0 20px rgba(0,240,255,0.15),inset 0 0 20px rgba(0,240,255,0.05);
  transform:translateY(-2px);
  color:#fff;
}
.social-link svg{
  width:18px;height:18px;flex-shrink:0;
  fill:currentColor;
  filter:drop-shadow(0 0 4px var(--neon-cyan));
  transition:filter .3s;
}
.social-link:hover svg{
  filter:drop-shadow(0 0 8px var(--neon-cyan));
}

/* corner accents on cards */
.social-link::after{
  content:'';position:absolute;top:0;right:0;
  width:8px;height:8px;
  border-top:1px solid var(--neon-cyan);
  border-right:1px solid var(--neon-cyan);
  opacity:.5;transition:opacity .3s;
}
.social-link:hover::after{opacity:1}

/* === STATUS BAR === */
.status-bar{
  font-family:'Share Tech Mono',monospace;
  font-size:.7rem;
  color:var(--text-dim);
  letter-spacing:.15em;
  text-transform:uppercase;
  text-align:center;
  animation:fadeInUp .8s ease-out .8s both;
}
.status-bar .online-dot{
  display:inline-block;width:6px;height:6px;
  background:var(--neon-cyan);border-radius:50%;
  margin-right:6px;
  box-shadow:0 0 6px var(--neon-cyan);
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.5;transform:scale(.8)}
}

/* === MOUSE FOLLOWER === */
.cursor-glow{
  position:fixed;width:200px;height:200px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(0,240,255,0.08),transparent 70%);
  pointer-events:none;z-index:1;
  transform:translate(-50%,-50%);
  transition:left .15s ease-out,top .15s ease-out;
}

/* === ANIMATIONS === */
@keyframes fadeInUp{
  from{opacity:0;transform:translateY(30px)}
  to{opacity:1;transform:translateY(0)}
}

/* === RESPONSIVE === */
@media(max-width:600px){
  .avatar-ring{width:120px;height:120px}
  .avatar-inner{font-size:2rem}
  .social-grid{gap:.6rem}
  .social-link{padding:.6rem 1rem;font-size:.75rem}
  .cursor-glow{display:none}
}

/* === CORNER DECORATIONS === */
.corner{
  position:fixed;z-index:3;pointer-events:none;
  width:60px;height:60px;
}
.corner--tl{top:16px;left:16px;border-top:1px solid var(--neon-cyan);border-left:1px solid var(--neon-cyan)}
.corner--tr{top:16px;right:16px;border-top:1px solid var(--neon-cyan);border-right:1px solid var(--neon-cyan)}
.corner--bl{bottom:16px;left:16px;border-bottom:1px solid var(--neon-pink);border-left:1px solid var(--neon-pink)}
.corner--br{bottom:16px;right:16px;border-bottom:1px solid var(--neon-pink);border-right:1px solid var(--neon-pink)}
.corner{opacity:.3}
</style>
</head>
<body>

    <span id="statusText">SYSTEM ONLINE — </span>
    <span id="clock"></span>
  </div>

</div>

<script>
/* Mouse follower */
const glow = document.getElementById('cursorGlow');
document.addEventListener('mousemove', e => {
  glow.style.left = e.clientX + 'px';
  glow.style.top = e.clientY + 'px';
});

/* Live clock */
const clockEl = document.getElementById('clock');
function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2, '0');
  const m = String(now.getMinutes()).padStart(2, '0');
  const s = String(now.getSeconds()).padStart(2, '0');
  clockEl.textContent = h + ':' + m + ':' + s;
}
updateClock();
setInterval(updateClock, 1000);

/* Typing effect for tagline */
const tagline = document.querySelector('.tagline');
const text = 'Dreamer';
const cursor = tagline.querySelector('.cursor');
tagline.textContent = '';
tagline.appendChild(cursor);
let i = 0;
function typeChar() {
  if (i < text.length) {
    tagline.insertBefore(document.createTextNode(text[i]), cursor);
    i++;
    setTimeout(typeChar, 150);
  }
}
setTimeout(typeChar, 1200);
</script>
